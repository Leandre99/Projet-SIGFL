# =========================================================================
# Base configuration shared by every profile.
# Profile-specific overrides live in application-{dev,test,prod}.yml.
# Secrets are NOT stored here: they are read from the environment (.env).
# =========================================================================
spring:
  application:
    name: SIGFL_Backend
  profiles:
    # Run with the "dev" profile unless SPRING_PROFILES_ACTIVE says otherwise.
    default: dev
  config:
    # Load .env from the working directory as a low-priority property source.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Envers history tables (Invoice_aud, ...) live in their own schema,
        # away from the application's public schema. Tables are Flyway-managed
        # (see db/migration), same as every other table — ddl-auto stays "validate".
        org:
          hibernate:
            envers:
              default_schema: audit

  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- File uploads (storage module) ---
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

  # --- SMTP transport, used by the mail module when mail.provider=smtp ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

# Note: the OAuth2 resource-server issuer-uri/jwk-set-uri (Keycloak) are set
# per-profile in application-dev.yml / application-prod.yml — intentionally
# absent in the test profile, which runs without Keycloak.

app:
  cors:
    # Comma-separated list. Default matches the SPA client redirect URIs
    # declared in docker/keycloak/realm-sigfl.json.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =========================================================================
# Application modules
# =========================================================================
# Storage: switch backend without code changes (STORAGE_PROVIDER=s3|local).
storage:
  provider: ${STORAGE_PROVIDER:local}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}
    bucket: ${STORAGE_S3_BUCKET:sigfl}
    path-style-access: ${STORAGE_S3_PATH_STYLE:true}
  local:
    base-path: ${STORAGE_LOCAL_PATH:./data/storage}

# Mail: switch transport without code changes (MAIL_PROVIDER=smtp|log).
mail:
  provider: ${MAIL_PROVIDER:log}
  from: ${MAIL_FROM:no-reply@sigfl.local}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: false
