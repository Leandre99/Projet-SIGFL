# =========================================================================
# TEST profile — automated tests.
# The datasource is provided at runtime by Testcontainers (@ServiceConnection),
# so no URL/credentials are declared here. Flyway runs against the container.
# =========================================================================
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.example.sigfl_backend: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
