# =========================================================================
# Local development stack for the SIGFL template:
#   db        PostgreSQL          :5432
#   keycloak  Auth (OIDC)         :8081   (admin console /admin, admin/admin)
#   minio     S3-compatible store :9000 (API) / :9001 (console)
#   maildev   SMTP + web inbox    :1025 (SMTP) / :1080 (web)
#   app       Spring Boot backend :8080
#
# Values come from the .env file in this directory (see .env.example).
#
#   docker compose up -d db keycloak minio maildev   # infra only, run app from IDE
#   docker compose up --build                        # full stack incl. the app
# =========================================================================
services:
  db:
    image: postgres:17-alpine
    container_name: sigfl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigfl}
      POSTGRES_USER: ${POSTGRES_USER:-sigfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigfl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the keycloak/audit schemas on first boot (empty volume only).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigfl} -d ${POSTGRES_DB:-sigfl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: sigfl-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      # Persist realm/user data in the sigfl Postgres instance instead of the
      # ephemeral embedded H2 — own schema, managed by Keycloak's own Liquibase
      # migrations (the "keycloak" schema itself is created by
      # docker/postgres/init/001-schemas.sql on first DB boot).
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-sigfl}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-sigfl}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sigfl}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    container_name: sigfl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: create the bucket the app expects, then exit.
  minio-init:
    image: minio/mc:latest
    container_name: sigfl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-sigfl};
      echo 'bucket ready';
      "

  maildev:
    image: maildev/maildev:latest
    container_name: sigfl-maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILDEV_WEB_PORT:-1080}:1080"    # Web inbox

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigfl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Inside the compose network, reach services by their name.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sigfl}
      DB_USERNAME: ${POSTGRES_USER:-sigfl}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sigfl}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Auth (Keycloak). issuer-uri must be the host clients actually use to reach
      # Keycloak (it must match the "iss" claim baked into their tokens) — that's
      # the published port, reachable from the host machine. jwk-set-uri is
      # fetched by *this container*, so it uses the internal compose network name.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/${KEYCLOAK_REALM:-sigfl}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-sigfl}/protocol/openid-connect/certs
      # Storage (MinIO via S3 API).
      STORAGE_PROVIDER: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-sigfl}
      STORAGE_S3_PATH_STYLE: "true"
      # Mail (MailDev).
      MAIL_PROVIDER: smtp
      MAIL_HOST: maildev
      MAIL_PORT: "1025"
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
  miniodata:
